name: CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - '.gitignore'
      - '.gitattributes'

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Projects target net8.0; global.json pins the 9.0 SDK to build them
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore Dependencies
        run: dotnet restore ItsTool.sln

      - name: Build Solution
        run: dotnet build ItsTool.sln --configuration Release --no-restore

      - name: Run Unit Tests with Coverage
        run: dotnet test tests/ItsTool.UnitTests/ItsTool.UnitTests.csproj --configuration Release --no-build --nologo /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput=./coverage.opencover.xml

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/ItsTool.UnitTests/coverage.opencover.xml
          retention-days: 7
