# Requires a .env file next to this file (never committed) with:
#   DB_PASSWORD=<strong password: 8+ chars, upper, lower, digit, symbol; no ';'>
#   JWT_SECRET=<random, 32+ characters, for example from: openssl rand -base64 48>
# and, for the first start only (the account must change its password at first login):
#   BOOTSTRAP_ADMIN_USERNAME=<first administrator's username>
#   BOOTSTRAP_ADMIN_EMAIL=<first administrator's e-mail>
#   BOOTSTRAP_ADMIN_PASSWORD=<12+ characters>
# and optionally:
#   APP_BASE_URL=<the address users open, for example https://itsm.fnrc.gov.ae; e-mail links use it>

services:
  # --------------------------------------------------------------------------
  # 1. SQL Server database
  # --------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: itstool-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - itstool-network

  # --------------------------------------------------------------------------
  # 2. ITSM application (API + web front end)
  # --------------------------------------------------------------------------
  itstool-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itstool-app
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5246:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AutoSeed=true
      - AppBaseUrl=${APP_BASE_URL:-http://localhost:5246}
      - Bootstrap__AdminUsername=${BOOTSTRAP_ADMIN_USERNAME:-}
      - Bootstrap__AdminEmail=${BOOTSTRAP_ADMIN_EMAIL:-}
      - Bootstrap__AdminPassword=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=FnrcItsm;User Id=sa;Password=${DB_PASSWORD:?Set DB_PASSWORD in .env};TrustServerCertificate=True
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - Jwt__Issuer=ItsToolAPI
      - Jwt__Audience=ItsToolClient
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src/ItsTool.Web/wwwroot:/app/wwwroot
    networks:
      - itstool-network

volumes:
  sqlserver_data:
    driver: local

networks:
  itstool-network:
    driver: bridge
