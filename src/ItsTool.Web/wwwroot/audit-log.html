<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="nav_audit" data-i18n-target="document-title">ITSM Tool - Audit Log</title>
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: var(--spacing-lg); flex-wrap: wrap; gap: var(--spacing-md); }
        .page-title h3 { margin: 0; font-size: 20px; color: var(--text-main); }
        .page-title p { margin: 4px 0 0 0; font-size: 13px; color: var(--text-muted); }
        
        .filter-panel { background: var(--bg-surface); padding: var(--spacing-lg); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: var(--spacing-lg); display: flex; flex-wrap: wrap; gap: var(--spacing-md); align-items: flex-end; }
        .filter-group { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
        .filter-group input { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; }
        .filter-group input:focus { border-color: var(--primary); outline: none; }
        
        .table-container { background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow-x: auto; }
        
        .empty-state { text-align: center; padding: var(--spacing-xxl) var(--spacing-lg); color: var(--text-muted); }
        
        /* Value formatting */
        .value-cell { font-family: monospace; font-size: 12px; background: var(--bg-body); padding: 2px 6px; border-radius: 3px; display: inline-block; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
    </style>
</head>
<body>
    <!-- Audit Detail Modal -->
    <div id="auditDetailModal" class="modal-overlay">
        <div class="modal" style="max-width: 500px;">
            <div class="modal-header">
                <h3 data-i18n="audit_detail">Audit Detail</h3>
                <button type="button" class="close-btn" onclick="document.getElementById('auditDetailModal').classList.remove('active')">&times;</button>
            </div>
            <div class="modal-body">
                <p id="auditDetailText" style="line-height: 1.5;"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="document.getElementById('auditDetailModal').classList.remove('active')" data-i18n="audit_btn_close">Close</button>
            </div>
        </div>
    </div>

    <div class="app-shell" data-shell>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </button>

                    <h2 data-i18n="audit_title">System Audit Log</h2>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell-container dropdown" style="position:relative; margin-inline-end: 16px;">
                        <button class="btn btn-ghost dropdown-toggle" type="button" id="bellDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="position:relative;">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                            <span class="badge" id="notificationBadge" style="display:none; position:absolute; top:4px; inset-inline-end:4px; background:var(--danger); color:white; border-radius:50%; font-size:10px; padding:2px 4px;"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bellDropdown" id="notificationList" style="width: 320px; max-height: 400px; overflow-y:auto;">
                            <li><h6 class="dropdown-header" data-i18n="topbar_notifications">Notifications</h6></li>
                            <div id="notificationItems"></div>
                            <li><hr class="dropdown-divider"></li>
                            <li><button type="button" class="dropdown-item text-center text-muted" onclick="markAllAsRead(event)" data-i18n="topbar_mark_all_read" style="width:100%; border:none; background:transparent;">Mark all as read</button></li>
                        </ul>
                    </div>
                    <div class="avatar">U</div>
                    <button class="btn btn-ghost" id="shellLogoutBtn" data-i18n="topbar_logout">Logout</button>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="page-title">
                        <h3 data-i18n="audit_subtitle">Event Log</h3>
                        <p data-i18n="audit_desc">Track all system and user activities across the platform.</p>
                    </div>
                </div>

                <div class="filter-panel">
                    <div class="filter-group">
                        <label for="filterTicket" data-i18n="audit_filter_ticket">Ticket ID</label>
                        <input id="filterTicket" placeholder="e.g. ITS-1" data-i18n="audit_ph_ticket" data-i18n-target="placeholder">
                    </div>
                    <div class="filter-group">
                        <label for="filterUserId" data-i18n="audit_filter_user">User ID</label>
                        <input id="filterUserId" placeholder="e.g. 5" data-i18n="audit_ph_user" data-i18n-target="placeholder">
                    </div>
                    <div class="filter-group">
                        <label for="filterAction" data-i18n="audit_filter_action">Action Type</label>
                        <input id="filterAction" placeholder="e.g. Created, Updated" data-i18n="audit_ph_action" data-i18n-target="placeholder">
                    </div>
                    <div class="filter-group">
                        <label for="filterFrom" data-i18n="audit_filter_from">From Date</label>
                        <input id="filterFrom">
                    </div>
                    <div class="filter-group">
                        <label for="filterTo" data-i18n="audit_filter_to">To Date</label>
                        <input id="filterTo">
                    </div>
                    <button type="button" class="btn btn-primary" id="btnSearchAudit" style="height: 38px; padding: 0 16px;">
                        <svg viewBox="0 0 24 24" width="18" height="18" style="fill: currentColor; margin-inline-end: 4px; vertical-align: middle;"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg> <span data-i18n="audit_filter_btn">Filter</span>
                    </button>
                    <button type="button" class="btn btn-secondary" id="btnResetAudit" style="height: 38px; padding: 0 14px;">
                        <span data-i18n="btn_reset_filter">Reset Filters</span>
                    </button>
                    <button type="button" class="btn btn-ghost" id="btnExportCsv" style="height: 38px; padding: 0 14px; border: 1px solid var(--border); color: var(--text-main);">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="margin-inline-end: 4px; vertical-align: middle;"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> <span data-i18n="btn_export_csv">Export CSV</span>
                    </button>
                </div>
                
                <div class="table-container">
                    <table class="table" style="min-width: 800px;">
                        <thead>
                            <tr>
                                <th data-i18n="audit_col_time">Timestamp</th>
                                <th data-i18n="audit_col_entity">Entity</th>
                                <th data-i18n="audit_col_user">User</th>
                                <th data-i18n="audit_col_action">Action</th>
                                <th data-i18n="audit_col_field">Field Modified</th>
                                <th data-i18n="audit_col_old">Old Value</th>
                                <th data-i18n="audit_col_new">New Value</th>
                                <th style="width: 140px; text-align:end; position: sticky; inset-inline-end: 0; background: var(--bg-surface); z-index: 2; box-shadow: -2px 0 5px rgba(0,0,0,0.05);" data-i18n="audit_col_actions">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="auditList">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import './js/api.js?v=999';
        import { injectShell } from './js/layout.js?v=999';
        import { bindShellActions, showToast } from './js/ui.js?v=999';
        import { t, getLocale } from './js/i18n.js';
        injectShell();

        if (!window.api.token) window.location.href = '/login.html';
        bindShellActions();

        let currentAuditItems = [];
        let currentLookup = {};
        let currentUsers = [];

        async function loadAuditLogs() {
            const ticket = document.getElementById('filterTicket').value;
            const userId = document.getElementById('filterUserId').value;
            const action = document.getElementById('filterAction').value;
            const fromDate = document.getElementById('filterFrom').value;
            const toDate = document.getElementById('filterTo').value;

            try {
                let lookup = {};
                let users = [];
                try {
                    lookup = await window.api.getLookup();
                    users = await window.api.getUsers();
                    currentLookup = lookup;
                    currentUsers = users;
                } catch (e) { console.error(e);  console.warn('Lookup failed in audit', e);  }

                const res = await window.api.getAuditLogs({
                    ticket, userId, action, fromDate, toDate, page: 1, pageSize: 100
                });
                
                const tbody = document.getElementById('auditList');
                tbody.innerHTML = '';
                
                currentAuditItems = res.items || [];

                if (currentAuditItems.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8">
                        <div class="empty-state" style="padding: 48px 24px;">
                            <svg viewBox="0 0 24 24" width="48" height="48" fill="var(--border)"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                            <h3 style="margin: 12px 0 4px; font-size: 16px; color: var(--text-main);">${t('audit_no_data')}</h3>
                            <p style="margin: 0 0 16px; font-size: 13px; color: var(--text-muted);">${t('audit_no_data_desc')}</p>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="window.resetAuditFilters()">${t('btn_reset_filter')}</button>
                        </div>
                    </td></tr>`;
                    return;
                }

                currentAuditItems.forEach(a => {
                    const tr = document.createElement('tr');
                    
                    const { mappedOld, mappedNew } = resolveAuditMappedValues(a, lookup, users);
                    
                    const oldVal = mappedOld ? `<span class="value-cell" dir="auto" title="${escapeHtml(mappedOld)}">${escapeHtml(mappedOld)}</span>` : '<span class="text-muted">-</span>';
                    const newVal = mappedNew ? `<span class="value-cell" dir="auto" title="${escapeHtml(mappedNew)}">${escapeHtml(mappedNew)}</span>` : '<span class="text-muted">-</span>';
                    
                    const entityNameText = a.entityName || (a.ticketId ? `ITS-${a.ticketId}` : 'Unknown');
                    const entityIdText = a.entityId || (a.ticketId ? a.ticketId.toString() : '');
                    const entityType = a.entityType || (a.ticketId ? 'Ticket' : 'Config');

                    const entityLink = entityType === 'Ticket' 
                        ? `<a href="/ticket-detail.html?id=${encodeURIComponent(entityIdText)}&highlight=true" style="font-weight:600; color:var(--primary);">ITS-${escapeHtml(entityIdText)}</a>` 
                        : `<span class="badge badge-default" style="margin-inline-end:4px;">${escapeHtml(formatEntityType(entityType))}</span> <span style="font-weight:500;">${escapeHtml(entityNameText)}</span>`;
                    
                    const creatorUser = users.find(u => String(u.id) === a.createdBy);
                    const creatorName = creatorUser ? `@${creatorUser.username}` : (a.createdBy || '-');

                    const deepLink = resolveAuditDeepLink(a, entityType, entityIdText);
                    const detailSentence = buildAuditDetailSentence(a, creatorName, entityNameText, entityType, mappedOld, mappedNew);

                    const actUpper = (a.action || '').toUpperCase();
                    let actionBadgeStyle = '';
                    if (actUpper === 'DELETED') {
                        actionBadgeStyle = 'background: #FEE2E2; color: #B91C1C; border: 1px solid #FCA5A5;';
                    } else if (actUpper === 'RESTORED') {
                        actionBadgeStyle = 'background: #ECFDF5; color: #047857; border: 1px solid #A7F3D0;';
                    } else if (actUpper === 'CREATED') {
                        actionBadgeStyle = 'background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE;';
                    }

                    tr.innerHTML = `
                        <td style="font-size: 13px; color: var(--text-muted);">${new Date(a.createdAt).toLocaleString(getLocale())}</td>
                        <td>${entityLink}</td>
                        <td style="font-family: monospace;">${escapeHtml(creatorName)}</td>
                        <td><span class="badge badge-default" style="${actionBadgeStyle}" title="${escapeHtml(a.action)}">${escapeHtml(formatAuditAction(a.action))}</span></td>
                        <td style="font-size: 13px; font-weight: 500;">${escapeHtml(formatAuditFieldName(a.fieldName)) || '-'}</td>
                        <td>${oldVal}</td>
                        <td>${newVal}</td>
                        <td style="text-align:end; position: sticky; inset-inline-end: 0; background: var(--bg-surface); z-index: 1; box-shadow: -2px 0 5px rgba(0,0,0,0.05);">
                            <button type="button" class="btn btn-ghost audit-detail-btn" style="padding:4px 8px; font-size:12px;">${t('audit_btn_detail')}</button>
                            <a href="${escapeHtml(deepLink)}" class="btn btn-ghost" style="padding:4px 8px; font-size:12px; color:var(--primary); ${deepLink === '#' ? 'display:none;' : ''}">${t('audit_btn_go')}</a>
                        </td>
                    `;
                    tr.querySelector('.audit-detail-btn').addEventListener('click', () => window.showAuditDetail(detailSentence));
                    tbody.appendChild(tr);
                });
            } catch (e) { console.error(e); 
                let errEl = document.querySelector('tbody') || document.querySelector('#overviewCards') || document.querySelector('#board') || document.querySelector('#articleList') || document.querySelector('.content-area');
                if (errEl) {
                    if (errEl.tagName === 'TBODY') {
                        errEl.innerHTML = `<tr><td colspan="100" style="text-align: center; padding: var(--spacing-xl); color: var(--danger);">${t('common_err_load_data')}</td></tr>`;
                     } else {
                        errEl.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--danger);">${t('common_err_load_data')}</div>`;
                    }
                }
 
                console.error(e);
                showToast('Failed to load audit logs. You might not have the required permissions.', 'error');
            }
        }

        // Stored field names (property names, and Turkish labels in older rows) to dictionary keys
        const AUDIT_FIELD_KEYS = {
            'New Record': 'audit_field_new_record',
            'Record Status': 'audit_field_record_status',
            'SLA Policy': 'audit_field_sla_policy',
            'Renk Kodu': 'audit_field_color',
            'CommentDeleted': 'audit_field_comment_deleted',
            'StatusId': 'audit_field_status',
            'ProjectId': 'audit_field_project',
            'Atanan Kullanıcı': 'audit_field_assignee',
            'Ek Dosya Eklendi': 'audit_field_attachment_added',
            'IsActive': 'audit_field_active',
            'AttachmentDeleted': 'audit_field_attachment_deleted',
            'InternalNoteAdded': 'audit_field_note_added',
            'Permissions': 'audit_field_permissions',
            'UserMentioned': 'audit_field_user_mentioned',
            'EstimatedEndDate': 'audit_field_end',
            'FullName': 'audit_field_full_name',
            'CommentRestored': 'audit_field_comment_restored',
            'Departman/Grup Aktarımı': 'audit_field_transfer',
            'Atanan Grup': 'audit_field_group',
            'Kayıt Durumu': 'audit_field_record_status',
            'CommentEdited': 'audit_field_comment_edited',
            'Ticket': 'audit_field_new_ticket',
            'Tahmini Başlangıç': 'audit_field_start',
            'ProfilePhoto': 'audit_field_profile_photo',
            'Title': 'audit_field_title',
            'Roles': 'audit_field_roles',
            'AssignedUserId': 'audit_field_assignee',
            'Ek Dosya Silindi': 'audit_field_attachment_deleted',
            'AssignedGroupId': 'audit_field_group',
            'Password': 'audit_field_password',
            'Tahmini Bitiş': 'audit_field_end',
            'CategoryId': 'audit_field_category',
            'RoleId': 'audit_field_role',
            'Yorum Eklendi': 'audit_field_comment_added',
            'Description': 'audit_field_description',
            'AttachmentAdded': 'audit_field_attachment_added',
            'Transfer': 'audit_field_transfer',
            'EstimatedStartDate': 'audit_field_start',
            'İç Not Eklendi': 'audit_field_note_added',
            'PriorityId': 'audit_field_priority',
            'ColorHex': 'audit_field_color',
            'IsDeleted': 'audit_field_deleted',
            'DepartmentId': 'audit_field_department',
            'Yeni Kayıt': 'audit_field_new_record',
            'Silinme Durumu': 'audit_field_deleted',
            'Aktiflik Durumu': 'audit_field_active',
            'SLA Politikası': 'audit_field_sla_policy',
            'Email': 'audit_field_email',
            'TypeId': 'audit_field_type',
            'CommentAdded': 'audit_field_comment_added'
        };
        const AUDIT_ENTITY_KEYS = { 'Ticket': 'audit_entity_ticket', 'User': 'audit_entity_user', 'Role': 'audit_entity_role', 'Group': 'audit_entity_group', 'GroupMember': 'audit_entity_groupmember', 'Department': 'audit_entity_department', 'Category': 'audit_entity_category', 'Project': 'audit_entity_project', 'SlaPolicy': 'audit_entity_slapolicy', 'KnowledgeArticle': 'audit_entity_knowledgearticle', 'AssignmentRule': 'audit_entity_assignmentrule', 'Webhook': 'audit_entity_webhook', 'Permission': 'audit_entity_permission', 'Status': 'audit_entity_status', 'Priority': 'audit_entity_priority', 'TicketType': 'audit_entity_tickettype', 'Config': 'audit_entity_config' };
        const AUDIT_ACTION_KEYS = { 'Created': 'audit_action_created', 'Updated': 'audit_action_updated', 'Deleted': 'audit_action_deleted', 'Restored': 'audit_action_restored', 'Moved': 'audit_action_moved', 'Assigned': 'audit_action_assigned', 'Unassigned': 'audit_action_unassigned', 'Transferred': 'audit_action_transferred', 'Escalated': 'audit_action_escalated', 'CreatedViaEmail': 'audit_action_createdviaemail', 'StatusChanged': 'audit_action_statuschanged', 'CommentAdded': 'audit_action_commentadded', 'CommentReplied': 'audit_action_commentreplied', 'InternalNoteAdded': 'audit_action_internalnoteadded', 'CommentEdited': 'audit_action_commentedited', 'CommentDeleted': 'audit_action_commentdeleted', 'CommentRestored': 'audit_action_commentrestored', 'AttachmentAdded': 'audit_action_attachmentadded', 'AttachmentDeleted': 'audit_action_attachmentdeleted', 'UserMentioned': 'audit_action_usermentioned', 'RoleAssigned': 'audit_action_roleassigned', 'RoleRevoked': 'audit_action_rolerevoked', 'PermissionAdded': 'audit_action_permissionadded', 'PermissionRemoved': 'audit_action_permissionremoved', 'PermissionOverrideSet': 'audit_action_permissionoverrideset', 'PermissionOverrideRemoved': 'audit_action_permissionoverrideremoved', 'PasswordReset': 'audit_action_passwordreset', 'ProfilePhotoUpdated': 'audit_action_profilephotoupdated', 'MemberAdded': 'audit_action_memberadded', 'MemberRemoved': 'audit_action_memberremoved' };
        // Values the server stored in Turkish in older rows
        const AUDIT_VALUE_KEYS = {
            'Deleted (soft delete)': 'audit_value_soft_deleted', 'Permanently deleted': 'audit_value_hard_deleted', 'Active / restored': 'audit_value_restored',
            'Silindi (Soft Deleted)': 'audit_value_soft_deleted', 'Kalıcı Silindi': 'audit_value_hard_deleted', 'Aktif / Geri Alındı': 'audit_value_restored'
        };
        const fill = (key, ...values) => values.reduce((s, value, i) => s.replaceAll(`{${i}}`, () => value ?? ''), t(key));

        function formatAuditFieldName(name) {
            if (!name || name === '-') return '-';
            const key = AUDIT_FIELD_KEYS[name];
            return key ? t(key) : name;
        }

        function formatEntityType(type) {
            const key = AUDIT_ENTITY_KEYS[type];
            return key ? t(key) : type;
        }

        function formatAuditAction(action) {
            const key = AUDIT_ACTION_KEYS[action];
            return key ? t(key) : action;
        }

        function translateStoredValue(value) {
            if (typeof value !== 'string') return value;
            return Object.entries(AUDIT_VALUE_KEYS).reduce((s, [stored, key]) => s.replace(stored, () => t(key)), value);
        }

        function resolveAuditMappedValues(a, lookup, users) {
            let mappedOld = a.oldValue;
            let mappedNew = a.newValue;
            
            if (a.fieldName === 'StatusId') {
                const sName = lookup.statuses?.find(s => String(s.id) === a.oldValue)?.name;
                mappedOld = sName ? (t('db_' + sName.toLowerCase().replaceAll(' ', '_'), sName)) : a.oldValue;
                const sNew = lookup.statuses?.find(s => String(s.id) === a.newValue)?.name;
                mappedNew = sNew ? (t('db_' + sNew.toLowerCase().replaceAll(' ', '_'), sNew)) : a.newValue;
            } else if (a.fieldName === 'Status' && a.entityType === 'KnowledgeArticle') {
                const sMap = { '0': t('kb_opt_draft'), '1': t('kb_opt_published'), '2': t('kb_badge_pending') };
                mappedOld = sMap[a.oldValue] || a.oldValue;
                mappedNew = sMap[a.newValue] || a.newValue;
            } else if (a.fieldName === 'PriorityId') {
                const pName = lookup.priorities?.find(s => String(s.id) === a.oldValue)?.name;
                mappedOld = pName ? (t('db_' + pName.toLowerCase().replaceAll(' ', '_'), pName)) : a.oldValue;
                const pNew = lookup.priorities?.find(s => String(s.id) === a.newValue)?.name;
                mappedNew = pNew ? (t('db_' + pNew.toLowerCase().replaceAll(' ', '_'), pNew)) : a.newValue;
            } else if (a.fieldName === 'CategoryId') {
                const cName = lookup.categories?.find(s => String(s.id) === a.oldValue)?.name;
                mappedOld = cName ? (t('db_' + cName.toLowerCase().replaceAll(' ', '_'), cName)) : a.oldValue;
                const cNew = lookup.categories?.find(s => String(s.id) === a.newValue)?.name;
                mappedNew = cNew ? (t('db_' + cNew.toLowerCase().replaceAll(' ', '_'), cNew)) : a.newValue;
            } else if (a.fieldName === 'ProjectId') {
                const prName = lookup.projects?.find(s => String(s.id) === a.oldValue)?.name;
                mappedOld = prName ? (t('db_' + prName.toLowerCase().replaceAll(' ', '_'), prName)) : a.oldValue;
                const prNew = lookup.projects?.find(s => String(s.id) === a.newValue)?.name;
                mappedNew = prNew ? (t('db_' + prNew.toLowerCase().replaceAll(' ', '_'), prNew)) : a.newValue;
            } else if (a.fieldName === 'AssignedUserId') {
                mappedOld = users?.find(s => String(s.id) === a.oldValue)?.firstName ? (users.find(s => String(s.id) === a.oldValue).firstName + ' ' + users.find(s => String(s.id) === a.oldValue).lastName) : a.oldValue;
                mappedNew = users?.find(s => String(s.id) === a.newValue)?.firstName ? (users.find(s => String(s.id) === a.newValue).firstName + ' ' + users.find(s => String(s.id) === a.newValue).lastName) : a.newValue;
            } else if (a.fieldName === 'AssignedGroupId') {
                mappedOld = lookup.groups?.find(s => String(s.id) === a.oldValue)?.name || a.oldValue;
                mappedNew = lookup.groups?.find(s => String(s.id) === a.newValue)?.name || a.newValue;
            } else if (a.fieldName === 'Transfer') {
                const parseTransfer = (val) => {
                    if (!val || val === 'Proj:,Grp:' || val === 'none') return val;
                    const mProj = val.match(/Proj:(-?\d*)/);
                    const mGrp = val.match(/Grp:(-?\d*)/);
                    const pId = mProj && mProj[1] ? mProj[1] : null;
                    const gId = mGrp && mGrp[1] ? mGrp[1] : null;
                    const prObj = pId && pId !== '-1' ? lookup.projects?.find(x => String(x.id) === pId) : null;
                    const grObj = gId && gId !== '-1' ? lookup.groups?.find(x => String(x.id) === gId) : null;
                    const pName = prObj ? (t('db_' + prObj.name.toLowerCase().replaceAll(' ', '_'), prObj.name)) : (pId && pId !== '-1' ? fill('audit_project_n', pId) : t('audit_no_project'));
                    const gName = grObj ? grObj.name : (gId && gId !== '-1' ? fill('audit_group_n', gId) : t('audit_no_group'));
                    return `Proj:${pId || 'none'},Grp:${gId || 'none'} (${pName}, ${gName})`;
                };
                mappedOld = parseTransfer(a.oldValue);
                mappedNew = parseTransfer(a.newValue);
            }
            return { mappedOld: translateStoredValue(mappedOld), mappedNew: translateStoredValue(mappedNew) };
        }

        function resolveAuditDeepLink(a, entityType, entityIdText) {
            const et = entityType.toLowerCase();
            if (et === 'ticket') {
                let deepLink = `/ticket-detail.html?id=${entityIdText}&highlight=true`;
                if (a.action === 'CommentAdded' || a.action === 'InternalNoteAdded' || a.action === 'CommentEdited' || a.action === 'CommentReplied') {
                    const cid = (!Number.isNaN(Number(a.fieldName)) && a.fieldName) ? a.fieldName : a.oldValue;
                    return deepLink + `&commentId=${cid}`;
                } 
                if (a.action === 'CommentDeleted') return deepLink + `&historyId=${a.id}`;
                if (a.action === 'ASSIGNED' || a.fieldName === 'Assignments' || a.fieldName === 'AssignedUserId' || a.fieldName === 'AssignedGroupId') return deepLink + `&focus=assign`;
                return deepLink;
            }
            
            const en = (a.entityName || '').toLowerCase();
            const linkMap = {
                'slapolicy': `/sla.html`,
                'sla': `/sla.html`,
                'rule': `/rules.html?highlight=${entityIdText}`,
                'webhook': `/webhooks.html?highlight=${entityIdText}`,
                'knowledgearticle': `/kb-article.html?id=${entityIdText}`,
                'user': `/users.html?highlight=${entityIdText}`,
                'groupmember': `/admin-crud.html?type=groups`,
                'project': `/admin-crud.html?type=projects&highlight=${entityIdText}`,
                'category': `/admin-crud.html?type=categories&highlight=${entityIdText}`,
                'department': `/admin-crud.html?type=departments&highlight=${entityIdText}`,
                'group': `/admin-crud.html?type=groups&highlight=${entityIdText}`,
                'role': `/admin-crud.html?type=roles&highlight=${entityIdText}`
            };
            
            if (en === 'assignmentrule') return `/rules.html?highlight=${entityIdText}`;
            return linkMap[et] || '#';
        }

        function buildAuditDetailSentence(a, creatorName, entityNameText, entityType, mappedOld, mappedNew) {
            const act = (a.action || '').toUpperCase();
            const entity = formatEntityType(entityType);
            const has = (value) => value && value !== '-';

            if (act === 'DELETED') {
                return fill('audit_s_deleted', creatorName, entity, entityNameText, has(mappedOld) ? fill('audit_s_deleted_summary', mappedOld) : t('audit_s_record_deleted')).trim();
            }
            if (act === 'RESTORED') {
                return fill('audit_s_restored', creatorName, entity, entityNameText, has(mappedNew) ? fill('audit_s_status', mappedNew) : '').trim();
            }
            if (act === 'CREATED') {
                return fill('audit_s_created', creatorName, entity, entityNameText, has(mappedNew) ? fill('audit_s_details', mappedNew) : '').trim();
            }
            if (act === 'COMMENTADDED' || act === 'INTERNALNOTEADDED') {
                return fill(act === 'INTERNALNOTEADDED' ? 'audit_s_note' : 'audit_s_comment', creatorName, entityNameText);
            }
            if (entityType.toLowerCase() === 'group' && a.action === 'Moved') {
                return fill('audit_s_moved', creatorName, entityNameText, mappedOld, mappedNew);
            }
            return fill('audit_s_updated', creatorName, formatAuditFieldName(a.fieldName) || '-', entity, entityNameText, mappedOld || '-', mappedNew || '-', formatAuditAction(a.action));
        }

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                .replaceAll('&', "&amp;")
                .replaceAll('<', "&lt;")
                .replaceAll('>', "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        window.showAuditDetail = function(message) {
            document.getElementById('auditDetailText').textContent = message;
            document.getElementById('auditDetailModal').classList.add('active');
        };

        window.resetAuditFilters = function() {
            document.getElementById('filterTicket').value = '';
            document.getElementById('filterUserId').value = '';
            document.getElementById('filterAction').value = '';
            document.getElementById('filterFrom').value = '';
            document.getElementById('filterTo').value = '';
            loadAuditLogs();
        };

        window.exportAuditCsv = function() {
            if (!currentAuditItems || currentAuditItems.length === 0) {
                showToast(t('audit_export_empty'), 'warning');
                return;
            }
            const headers = ['audit_col_time', 'audit_col_entity_type', 'audit_col_entity', 'audit_col_user', 'audit_col_action', 'audit_col_field', 'audit_col_old', 'audit_col_new'].map(key => t(key));
            const rows = currentAuditItems.map(a => {
                const { mappedOld, mappedNew } = resolveAuditMappedValues(a, currentLookup, currentUsers);
                const entityType = a.entityType || (a.ticketId ? 'Ticket' : 'Config');
                const entityNameText = a.entityName || (a.ticketId ? `ITS-${a.ticketId}` : 'Unknown');
                const creatorUser = currentUsers.find(u => String(u.id) === a.createdBy);
                const creatorName = creatorUser ? `@${creatorUser.username}` : (a.createdBy || '-');

                return [
                    new Date(a.createdAt).toLocaleString(getLocale()),
                    formatEntityType(entityType),
                    entityNameText,
                    creatorName,
                    formatAuditAction(a.action || ''),
                    formatAuditFieldName(a.fieldName || ''),
                    mappedOld || '',
                    mappedNew || ''
                ].map(cell => `"${(cell || '').toString().replaceAll('"', '""')}"`).join(',');
            });

            const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            const dateStr = new Date().toISOString().slice(0, 10);
            downloadAnchor.download = `audit-log-${dateStr}.csv`;
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
            URL.revokeObjectURL(url);
            showToast(t('audit_export_done'), 'success');
        };

        document.getElementById('btnResetAudit')?.addEventListener('click', window.resetAuditFilters);
        document.getElementById('btnExportCsv')?.addEventListener('click', window.exportAuditCsv);

        document.getElementById('btnSearchAudit').addEventListener('click', async () => {
            const btn = document.getElementById('btnSearchAudit');
            btn.style.opacity = '0.7';
            btn.innerHTML = t('audit_filter_loading');
            await loadAuditLogs();
            btn.style.opacity = '1';
            btn.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" style="fill: currentColor; margin-inline-end: 4px; vertical-align: middle;"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg> <span data-i18n="audit_filter_btn">${t('audit_filter_btn')}</span>`;
        });

        // Add enter key support for inputs
        document.querySelectorAll('.filter-group input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') document.getElementById('btnSearchAudit').click();
            });
        });
        await loadAuditLogs();
    </script>
</body>
</html>
