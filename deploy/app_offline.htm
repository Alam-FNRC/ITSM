<!DOCTYPE html>
<!-- While this file is in the site folder, IIS stops the app and shows this page. update-site.ps1 adds and removes it. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service desk update</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAF9F6; color: #183B3B;
               font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
        main { max-width: 32rem; padding: 2rem 1.5rem; text-align: center; }
        h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
        p { margin: 0 0 1.5rem; color: #5D6B69; line-height: 1.5; }
        hr { border: 0; border-top: 1px solid #D9DEDC; margin: 1.5rem 0; }
    </style>
</head>
<body>
<main>
    <h1>The service desk is being updated</h1>
    <p>Please try again in a few minutes.</p>
    <hr>
    <h1 lang="ar" dir="rtl">جارٍ تحديث مكتب الخدمة</h1>
    <p lang="ar" dir="rtl">يرجى المحاولة مرة أخرى بعد بضع دقائق.</p>
</main>
</body>
</html>
